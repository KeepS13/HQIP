name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install paramiko
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: go vet -tags=with_utls ./...
      - run: go test -tags=with_utls -race ./...
  runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            runtime/hysteria/**/go.sum
      - run: go test -race ../nodepolicy/... ./core/server ./core/internal/integration_tests ./app/cmd
        working-directory: runtime/hysteria
  linux-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Unpublished same-repository fallback; helper rejects PRs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            runtime/hysteria/**/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            user-web/package-lock.json
      - run: npm --prefix admin-web ci
      - run: npm --prefix user-web ci
      - run: npm --prefix user-web test
      - run: node --test admin-web/tests/*.test.mjs
      - run: npm --prefix admin-web run build
      - run: npm --prefix user-web run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build.py --skip-web --server-only
      - uses: actions/upload-artifact@v4
        id: upload_linux
        continue-on-error: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          name: linux-release
          path: |
            dist/hqip-linux-amd64
            dist/hqip-migrate-postgres-linux-amd64
            dist/agent-linux-amd64
            dist/agent-linux-arm64
            dist/hysteria-linux-amd64
            dist/hysteria-linux-arm64
            dist/caddy-linux-amd64
            dist/manifest.json
            admin-web/dist
            user-web/dist
          if-no-files-found: error
          retention-days: 3
      - name: Transfer Linux artifacts through an unpublished draft if Actions storage is unavailable
        if: steps.upload_linux.outcome == 'failure' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_artifacts.py upload linux-release
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hqip_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: hqip_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hqip_test -d hqip_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HQIP_TEST_POSTGRES_URL: postgres://hqip_test:test-only-password@127.0.0.1:5432/hqip_test?sslmode=disable
      HQIP_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install matching PostgreSQL backup tools
        run: |
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/keyrings/hqip-pgdg.asc >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/hqip-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/hqip-pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
      - run: go test -race ./internal/store ./internal/control ./internal/pgstore ./internal/ratelimit ./cmd/hqip
      - name: Repeat concurrent payment idempotency and settings checks
        run: go test -race ./internal/store -run '^TestPayment(DoubleClick|ConcurrentSettings|LateClosed)' -count=15
      - name: Start generated storage configuration with restricted roles
        run: |
          python3 scripts/prepare_storage.py --output "$RUNNER_TEMP/hqip-storage"
          docker compose -f "$RUNNER_TEMP/hqip-storage/compose.yaml" up -d --wait --wait-timeout 120
      - name: Verify application database role and restricted Redis ACL
        run: |
          set -a
          . "$RUNNER_TEMP/hqip-storage/migration.env"
          HQIP_TEST_POSTGRES_MIGRATION_URL="$HQIP_DATABASE_URL"
          . "$RUNNER_TEMP/hqip-storage/storage.env"
          HQIP_TEST_POSTGRES_APP_URL="$HQIP_DATABASE_URL"
          HQIP_TEST_REDIS_ACL_URL="$HQIP_REDIS_URL"
          set +a
          go test -race ./internal/store ./internal/ratelimit -run 'TestPostgresApplicationRole|TestRealRedisRestrictedACL|TestRealRedisAdminProtectionOriginalRestrictedACL' -count=1
      - name: Remove isolated storage stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hqip-storage/compose.yaml" ]; then
            docker compose -f "$RUNNER_TEMP/hqip-storage/compose.yaml" down --volumes --remove-orphans
          fi
  # Platform regression and packaging are independent. The production gate
  # below still requires both, plus every real-client matrix entry.
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
      - run: go vet -tags=with_utls ./...
      - run: go test -tags=with_utls ./...
      - run: New-Item -ItemType Directory -Force dist | Out-Null
        shell: pwsh
      - run: go build -trimpath -o dist/hqip-windows-amd64.exe ./cmd/hqip
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # Required only for the main-branch draft fallback.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/**/go.sum
            runtime/hysteria/**/go.sum
            scripts/build_billing_core.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix desktop/frontend ci
      - run: npm --prefix desktop/frontend run build
      - run: go vet ./...
        working-directory: desktop
      - run: go test ./...
        working-directory: desktop
      - run: python scripts/build_desktop.py --skip-web
      - uses: actions/upload-artifact@v4
        id: upload_windows
        continue-on-error: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          name: windows-release
          path: |
            dist/HQIP-Windows-x64.zip
            dist/desktop-manifest.json
          if-no-files-found: error
          retention-days: 3
      - name: Transfer Windows artifacts through an unpublished draft if Actions storage is unavailable
        if: steps.upload_windows.outcome == 'failure' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_artifacts.py upload windows-release
  windows-e2e:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      # Each worker owns its ports, core processes and ledgers. Keep all results
      # when one group fails, rather than cancelling useful regression evidence.
      fail-fast: false
      matrix:
        include:
          - group: billing
            tests: TestTrafficBillingRealDualProtocolHotUpdate|TestNodeQuotaRealWebsiteOutageAndReconciliation|TestRealityDirectSurvivesHY2ProcessCrashAndRestart
          - group: slots
            tests: TestOnlineIPRealTwoNodesAndDifferentSource|TestConnectionSlotsRealTwoNodeSwitchAndReconnect|TestActivitySlotsRealProbesReleaseWhileClientsStayOpen
          - group: expiry
            tests: TestOfflineExpiryRealClientsReleaseAfterAdministrativeEdit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            runtime/hysteria/**/go.sum
            .github/workflows/ci.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        id: download_windows
        continue-on-error: true
        with:
          name: windows-release
          path: dist
      - name: Recover the same-run Windows artifact if necessary
        if: steps.download_windows.outcome == 'failure' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_artifacts.py download windows-release --root dist
      - name: Verify same-commit package and extract the pinned test core
        shell: python
        run: |
          import hashlib, json, os, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from ci_artifacts import verify_files
          from build_billing_core import CORE_HASH
          verify_files('windows-release', Path('dist'), os.environ['GITHUB_SHA'])
          with zipfile.ZipFile('dist/HQIP-Windows-x64.zip') as package:
              inner = json.loads(package.read('HQIP/manifest.json'))
              if inner.get('sourceSHA') != os.environ['GITHUB_SHA'] or inner.get('dirty') is not False:
                  raise ValueError('Test core must belong to this clean build')
              output = Path('dist/test-core')
              output.mkdir()
              # Read only explicit members; never extract archive-selected paths.
              for name in ('sing-box.exe', 'libcronet.dll'):
                  data = package.read('HQIP/' + name)
                  expected = CORE_HASH if name == 'sing-box.exe' else inner['sha256'][name]
                  if hashlib.sha256(data).hexdigest() != expected:
                      raise ValueError('Test core checksum mismatch: ' + name)
                  (output / name).write_bytes(data)
      - name: Verify Vision and outbound statistics with the packaged core
        if: matrix.group == 'expiry'
        shell: pwsh
        run: |
          $env:HQIP_SINGBOX_EXE = (Resolve-Path dist/test-core/sing-box.exe).Path
          # The pinned upstream TLS adapter transports field pointers as uintptr.
          # Scope the checkptr exception to that dependency; race checks remain on.
          go test -tags=with_utls -race '-gcflags=github.com/sagernet/sing-vmess/vless=-d=checkptr=0' ./internal/reality -run TestSingBoxRealityGuardedWire -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/client -run TestPinnedCoreProxyStatistics -count=1 -v
      - name: Run real-client regression group
        shell: pwsh
        env:
          E2E_TESTS: ${{ matrix.tests }}
        run: |
          go build -C runtime/hysteria/app -trimpath -o ../../../dist/hysteria-billing-test.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HQIP_E2E_CORE = (Resolve-Path dist/hysteria-billing-test.exe).Path
          $env:HQIP_SINGBOX_EXE = (Resolve-Path dist/test-core/sing-box.exe).Path
          go test -tags=with_utls -race '-gcflags=github.com/sagernet/sing-vmess/vless=-d=checkptr=0' ./internal/agent -run "^($env:E2E_TESTS)$" -count=1 -v
  # Native platforms build concurrently. Tool caches contain no signing keys;
  # PRs use disposable identities and cannot publish deployable receipts.
  client:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-amd64, android-arm64, android-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            native/mobile/go.sum
            scripts/build_billing_core.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - uses: actions/setup-java@v4
        if: matrix.platform != 'windows-amd64'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform != 'windows-amd64'
        with:
          packages: platform-tools
      - name: Install pinned Android SDK and NDK
        if: matrix.platform != 'windows-amd64'
        run: sdkmanager 'platforms;android-36' 'build-tools;37.0.0' 'ndk;30.0.16248370'
      - uses: actions/cache@v4
        with:
          path: |
            .local/godot-tools/*.zip
            .local/godot-tools/*.tpz
            .local/godot-tools/innosetup-6.7.3.exe
          key: client-tools-windows-4.7.2-6.7.3-8.11.1-${{ matrix.platform }}
      - uses: actions/cache@v4
        if: matrix.platform != 'windows-amd64'
        with:
          path: ~/.gradle/caches
          key: client-gradle-${{ runner.os }}-${{ hashFiles('native/android/build.gradle') }}
      - name: Prepare verified build tools
        run: python scripts/prepare_client_ci.py tools ${{ matrix.platform }}
      - name: Prepare isolated signing identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HQIP_CLIENT_UPDATE_SEED: ${{ secrets.HQIP_CLIENT_UPDATE_SEED }}
          HQIP_ANDROID_KEYSTORE: ${{ secrets.HQIP_ANDROID_KEYSTORE }}
          HQIP_ANDROID_SIGNING_JSON: ${{ secrets.HQIP_ANDROID_SIGNING_JSON }}
        run: python scripts/prepare_client_ci.py signing ${{ matrix.platform }}
      - name: Prepare disposable PR signing identity
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: python scripts/prepare_client_ci.py signing ${{ matrix.platform }}
      - name: Build current client
        shell: pwsh
        run: |
          $release = Get-Content packaging/client-version.json -Raw | ConvertFrom-Json
          $target = '${{ matrix.platform }}'.Split('-')
          $buildArgs = @('--platform', $target[0], '--version', $release.version, '--sequence', $release.sequence,
            '--godot', '.local/godot-tools/Godot_v4.7.2-stable_win64_console.exe',
            '--key', '.local/ci-signing/ed25519.seed', '--android-signing', '.local/ci-signing/android.json')
          if ($target[0] -eq 'android') {
            $env:ANDROID_NDK_HOME = Join-Path $env:ANDROID_HOME 'ndk/30.0.16248370'
            $buildArgs += @('--android-arch', $target[1])
          }
          python scripts/build_godot.py @buildArgs
      - name: Verify Godot interactions and actual runtime pipe
        if: matrix.platform == 'windows-amd64'
        shell: python
        run: |
          import pathlib, subprocess
          for test in sorted(pathlib.Path('godot-client/tests').glob('*.gd')):
              subprocess.run(['.local/godot-tools/Godot_v4.7.2-stable_win64_console.exe',
                  '--headless', '--path', 'godot-client', '--script', 'res://tests/' + test.name], check=True, timeout=90)
      - name: Create verified same-commit receipt
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python scripts/client_ci.py receipt --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        id: upload_client
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          name: client-${{ matrix.platform }}
          path: dist/client-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3
      - name: Transfer verified client through same-run draft if needed
        if: steps.upload_client.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_artifacts.py upload client-${{ matrix.platform }}
      - name: Remove job-owned signing material
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root = Path('.local/ci-signing').resolve()
          if root.parent == (Path.cwd() / '.local').resolve() and root.is_dir() and not root.is_symlink():
              shutil.rmtree(root)
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HQIP_DEPLOY_PAUSED != 'true'
    needs: [check, runtime-test, linux-release, windows, windows-test, windows-e2e, postgres, client]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Read and clean only this run's unpublished fallback drafts.
    timeout-minutes: 30
    concurrency:
      group: hqip-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hqip.sharevps.online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        id: download_linux
        continue-on-error: true
        with:
          name: linux-release
          path: .
      - name: Recover verified Linux artifacts from the same-run draft
        if: steps.download_linux.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_artifacts.py download linux-release
      - uses: actions/download-artifact@v4
        id: download_windows
        continue-on-error: true
        with:
          name: windows-release
          path: dist
      - name: Recover verified Windows artifacts from the same-run draft
        if: steps.download_windows.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_artifacts.py download windows-release --root dist
      - run: python3 -m pip install cryptography
      - uses: actions/download-artifact@v4
        id: download_clients
        continue-on-error: true
        with:
          pattern: client-*
          path: dist
      - name: Recover missing same-run client artifacts and verify signatures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from client_bundle import CLIENT_PLATFORMS, verify_client_bundle
          for platform in CLIENT_PLATFORMS:
              root = pathlib.Path('dist/client-' + platform)
              if not (root / 'godot-downloads.json').is_file():
                  subprocess.run([sys.executable, 'scripts/ci_artifacts.py', 'download',
                      'client-' + platform, '--root', str(root)], check=True)
              verify_client_bundle(root, os.environ['GITHUB_SHA'], [platform], signatures=True)
      - run: python3 scripts/client_ci.py assemble
      - name: Deploy tested commit with backup and health checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: python3 scripts/deploy_ci.py
      - name: Remove this run's temporary drafts after deployment acceptance
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_artifacts.py cleanup linux-release
          python3 scripts/ci_artifacts.py cleanup windows-release
          python3 scripts/ci_artifacts.py cleanup client-windows-amd64
          python3 scripts/ci_artifacts.py cleanup client-android-arm64
          python3 scripts/ci_artifacts.py cleanup client-android-amd64
