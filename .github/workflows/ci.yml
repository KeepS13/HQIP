name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            user-web/package-lock.json
      - run: npm --prefix admin-web ci
      - run: npm --prefix user-web ci
      - run: npm --prefix admin-web run build
      - run: npm --prefix user-web run build
      - run: go vet ./...
      - run: go test -race ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install paramiko
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python3 scripts/build.py --skip-web --skip-download
      - run: go test -race ./core/server ./core/internal/integration_tests ./app/cmd
        working-directory: runtime/hysteria
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/hqip-linux-amd64
            admin-web/dist
            user-web/dist
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            admin-web/package-lock.json
            user-web/package-lock.json
            desktop/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix admin-web ci
      - run: npm --prefix user-web ci
      - run: npm --prefix admin-web run build
      - run: npm --prefix user-web run build
      - run: npm --prefix desktop/frontend ci
      - run: npm --prefix desktop/frontend run build
      - run: go vet ./...
      - run: go test ./...
      - run: New-Item -ItemType Directory -Force dist | Out-Null
        shell: pwsh
      - run: go build -trimpath -o dist/hqip-windows-amd64.exe ./cmd/hqip
      - run: go vet ./...
        working-directory: desktop
      - run: go test ./...
        working-directory: desktop
      - run: python scripts/build_desktop.py --skip-web
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/HQIP-Windows-x64.zip
            dist/desktop-manifest.json
          if-no-files-found: error
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hqip-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hqip.5202345.xyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Deploy tested commit with backup and health checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: python3 scripts/deploy_ci.py
