name: Flutter preview
on:
  workflow_dispatch:
    inputs:
      action:
        description: Test artifacts, publish the tested main commit, or roll back a preview transaction
        required: true
        default: test
        type: choice
        options: [test, publish, rollback]
      rollback_run:
        description: Exact successful publication transaction (run ID-attempt), for rollback only
        required: false
        type: string
  pull_request:
    paths:
      - 'flutter-client/**'
      - 'internal/flutterrelease/**'
      - 'internal/previewhost/**'
      - 'internal/client/flutter*'
      - 'cmd/hqip-flutter-*/**'
      - 'native/mobile/**'
      - 'packaging/flutter*'
      - 'packaging/languages/**'
      - 'scripts/*flutter*'
      - 'scripts/render_domains.py'
      - 'deploy/nginx-hqip.conf'
      - '.github/workflows/flutter-preview.yml'
permissions:
  contents: read
  actions: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography paramiko
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: python -m unittest discover -s scripts -p 'test_flutter_*.py'
      - name: Require green main CI for publication or rollback
        if: github.event_name == 'workflow_dispatch' && inputs.action != 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/deploy_flutter_preview.py --check-only
  build:
    if: inputs.action != 'rollback'
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
    outputs:
      fallback: ${{ steps.upload.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            go.sum
            native/mobile/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare pinned Flutter and native tools
        shell: pwsh
        run: |
          $version = Get-Content packaging/flutter-version.json -Raw | ConvertFrom-Json
          git clone --depth 1 --branch $version.flutter https://github.com/flutter/flutter.git .local/flutter-sdk
          if ((git -C .local/flutter-sdk rev-parse HEAD) -ne $version.flutterCommit) { throw 'Unexpected Flutter SDK commit' }
          python -m pip install cryptography
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_flutter.py tools --platform windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_flutter.py tools --platform android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
      - name: Import persistent preview identity
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'publish'
        env:
          HQIP_FLUTTER_UPDATE_SEED: ${{ secrets.HQIP_FLUTTER_UPDATE_SEED }}
          HQIP_FLUTTER_ANDROID_KEYSTORE: ${{ secrets.HQIP_FLUTTER_ANDROID_KEYSTORE }}
          HQIP_FLUTTER_ANDROID_SIGNING_JSON: ${{ secrets.HQIP_FLUTTER_ANDROID_SIGNING_JSON }}
        shell: python
        run: |
          import os, subprocess, sys
          for name in ['HQIP_FLUTTER_UPDATE_SEED', 'HQIP_FLUTTER_ANDROID_KEYSTORE', 'HQIP_FLUTTER_ANDROID_SIGNING_JSON']:
              if not os.environ.get(name): raise SystemExit('Missing independent preview signing secret: ' + name)
          subprocess.run([sys.executable, 'scripts/prepare_flutter.py', 'signing'], check=True)
      - name: Create disposable test identity
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'publish'
        run: python scripts/prepare_flutter.py signing
      - name: Test controller and preview boundaries
        run: go test -tags=with_utls ./internal/client ./internal/clientbridge ./internal/control ./internal/flutterrelease ./internal/previewhost ./cmd/hqip-flutter-host ./cmd/hqip-flutter-launcher
      - name: Analyze and test Flutter
        working-directory: flutter-client
        shell: pwsh
        run: |
          ../.local/flutter-sdk/bin/flutter.bat --suppress-analytics pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../.local/flutter-sdk/bin/flutter.bat --suppress-analytics analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../.local/flutter-sdk/bin/flutter.bat --suppress-analytics test
      - name: Build and sign all preview platforms
        shell: pwsh
        run: |
          python scripts/build_flutter.py windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_flutter.py android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package clean-source publication
        if: inputs.action == 'publish'
        run: python scripts/flutter_channel.py
      - name: Package test-only publication
        if: inputs.action != 'publish'
        run: python scripts/flutter_channel.py --public-key dist/flutter-preview/update-public-key.txt
      - uses: actions/upload-artifact@v4
        id: upload
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'publish' }}
        with:
          name: flutter-preview-publication
          path: dist/flutter-preview-publication.tar.gz
          retention-days: 3
          if-no-files-found: error
      - name: Use a private draft if Actions storage is unavailable
        if: steps.upload.outcome == 'failure' && inputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/flutter_preview_transfer.py upload
      - name: Remove job-owned signing files
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root = Path('.local/flutter-signing').resolve()
          if root.parent == (Path.cwd() / '.local').resolve() and root.is_dir() and not root.is_symlink():
              shutil.rmtree(root)
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'publish'
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    concurrency:
      group: hqip-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          name: flutter-preview-publication
          path: dist
      - name: Recover the same-run signed publication
        if: steps.download.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/flutter_preview_transfer.py download
      - name: Publish preview with public acceptance and automatic rollback
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: python scripts/deploy_flutter_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: flutter-preview-acceptance
          path: dist/flutter-preview-acceptance
          retention-days: 3
          if-no-files-found: ignore
      - name: Remove accepted temporary draft
        if: success() && needs.build.outputs.fallback == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/flutter_preview_transfer.py cleanup
  rollback:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'rollback'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: hqip-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - name: Restore exact preview transaction
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PREVIEW_ROLLBACK_RUN: ${{ inputs.rollback_run }}
        run: |
          test -n "$PREVIEW_ROLLBACK_RUN"
          python scripts/deploy_flutter_preview.py --rollback-run "$PREVIEW_ROLLBACK_RUN"
