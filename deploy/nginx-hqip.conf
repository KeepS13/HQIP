# This file is included inside nginx's http block. Never log subscription URIs.
log_format hqip_control_safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
server {
    listen 80;
    listen [::]:80;
    server_name hqip.5202345.xyz;
    access_log /var/log/nginx/hqip-control.access.log hqip_control_safe;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://hqip.5202345.xyz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hqip.5202345.xyz;
    ssl_certificate /etc/letsencrypt/live/hqip.5202345.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hqip.5202345.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/hqip-control.access.log hqip_control_safe;
    error_log /dev/null crit;
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    location ~ ^/(api/v1/(client|agents|user)(/|$)|api/v2/client(/|$)|sub/|usub/|healthz$) {
        proxy_pass http://127.0.0.1:18091;
    }
    location = /admin { proxy_pass http://127.0.0.1:18090; }
    location ^~ /admin/ { proxy_pass http://127.0.0.1:18090; }
    location /api/ { proxy_pass http://127.0.0.1:18090; }
    location = /s { return 410; }
    location ^~ /s/ { return 410; }
    location / {
        proxy_pass http://127.0.0.1:18091;
    }
}
