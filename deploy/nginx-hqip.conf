 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api-hqip.5202345.xyz; frame-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
 add_header Cache-Control $hqip_static_cache always;
 location = /admin { return 404; }
