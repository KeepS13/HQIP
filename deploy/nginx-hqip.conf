# Included in nginx http; never log tokens, queries or authorization codes.
log_format hqip_control_safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
map $request_uri $hqip_user_csp {
 default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api-hqip.5202345.xyz; frame-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
 ~^/(login|register|authorize)(\?|$) "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api-hqip.5202345.xyz https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
}
map $uri $hqip_static_cache { default "no-store"; ~^/assets/ "public, max-age=31536000, immutable"; }
server {
 listen 80; listen [::]:80;
 server_name hqip.5202345.xyz;
 access_log /var/log/nginx/hqip-control.access.log hqip_control_safe;
 error_log /dev/null crit;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
 location / { return 301 https://hqip.5202345.xyz$request_uri; }
}
server {
 listen 80; listen [::]:80;
 server_name cms-hqip.5202345.xyz;
 access_log /var/log/nginx/hqip-control.access.log hqip_control_safe;
 error_log /dev/null crit;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
 location / { return 301 https://cms-hqip.5202345.xyz$request_uri; }
}
server {
 listen 80; listen [::]:80;
 server_name api-hqip.5202345.xyz;
 access_log /var/log/nginx/hqip-control.access.log hqip_control_safe;
 error_log /dev/null crit;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
 location / { return 301 https://api-hqip.5202345.xyz$request_uri; }
}
server {
 listen 443 ssl; listen [::]:443 ssl; http2 on;
 server_name hqip.5202345.xyz;
 ssl_certificate /etc/letsencrypt/live/hqip.5202345.xyz/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/hqip.5202345.xyz/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log /var/log/nginx/hqip-control.access.log hqip_control_safe;
 error_log /dev/null crit;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 root /opt/hqip-control/current/user-web;
 index index.html;
 add_header Content-Security-Policy "$hqip_user_csp" always;
 add_header Cache-Control $hqip_static_cache always;
 location = /admin { return 404; }
 location ^~ /admin/ { return 404; }
 location ~ ^/(api(/|$)|sub(/|$)|usub(/|$)|healthz$|s(/|$)|downloads/.+) { return 410; }
 location ~ /\. { return 404; }
 location ^~ /assets/ { try_files $uri =404; }
 location = /favicon.svg { try_files $uri =404; }
 location = /index.html { try_files $uri =404; }
 location / { try_files $uri /index.html; }
}
server {
 listen 443 ssl; listen [::]:443 ssl; http2 on;
