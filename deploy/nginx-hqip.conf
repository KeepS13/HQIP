# Included in nginx http; never log tokens, queries or authorization codes.
log_format hqip_control_safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
limit_conn_zone $binary_remote_addr zone=hqip_api_connections:10m;
geo $realip_remote_addr $hqip_cloudflare_peer {
 default 0;
 173.245.48.0/20 1;
 103.21.244.0/22 1;
 103.22.200.0/22 1;
 103.31.4.0/22 1;
 141.101.64.0/18 1;
 108.162.192.0/18 1;
 190.93.240.0/20 1;
 188.114.96.0/20 1;
 197.234.240.0/22 1;
 198.41.128.0/17 1;
 162.158.0.0/15 1;
 104.16.0.0/13 1;
 104.24.0.0/14 1;
 172.64.0.0/13 1;
 131.0.72.0/22 1;
 2400:cb00::/32 1;
 2606:4700::/32 1;
 2803:f800::/32 1;
 2405:b500::/32 1;
 2405:8100::/32 1;
 2a06:98c0::/29 1;
 2c0f:f248::/32 1;
}
map $request_uri $hqip_user_csp {
 default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://hqip.sharevps.online; frame-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
 ~^/(login|register|authorize)(\?|$) "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://hqip.sharevps.online https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
}
# Download handlers own cache policy: only verified hash URLs are immutable.
map $uri $hqip_static_cache { default "no-store"; ~^/assets/ "public, max-age=31536000, immutable"; ~^/downloads/ ""; }
server {
 listen 80; listen [::]:80;
 server_name hqip.sharevps.online;
 access_log /var/log/nginx/hqip-control/access.log hqip_control_safe;
 error_log /dev/null crit;
 location ~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]{1,128}$" { root /var/www/letsencrypt; try_files $uri =404; }
 location / { if ($hqip_cloudflare_peer = 0) { return 403; } return 301 https://hqip.sharevps.online$request_uri; }
}
server {
 listen 80; listen [::]:80;
 server_name cms-hqip.sharevps.online;
 access_log /var/log/nginx/hqip-control/access.log hqip_control_safe;
 error_log /dev/null crit;
 location ~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]{1,128}$" { root /var/www/letsencrypt; try_files $uri =404; }
 location / { if ($hqip_cloudflare_peer = 0) { return 403; } return 301 https://cms-hqip.sharevps.online$request_uri; }
}
server {
 listen 443 ssl http2; listen [::]:443 ssl http2;
 server_name hqip.sharevps.online;
 ssl_certificate /etc/letsencrypt/live/hqip.sharevps.online/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/hqip.sharevps.online/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 if ($hqip_cloudflare_peer = 0) { return 403; }
 access_log /var/log/nginx/hqip-control/access.log hqip_control_safe;
 error_log /dev/null crit;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 root /opt/hqip-control/current/user-web;
 index index.html;
 add_header Content-Security-Policy "$hqip_user_csp" always;
 add_header Cache-Control $hqip_static_cache always;
 location = /admin { return 404; }
 location ^~ /admin/ { return 404; }
 # BEGIN HQIP Flutter preview
 location = /api/v3/client/releases {
  if ($arg_client = flutter) { rewrite ^ /__hqip_flutter_preview/releases.json last; }
  proxy_pass http://127.0.0.1:18091;
 }
 location = /__hqip_flutter_preview/releases.json {
  internal;
  if ($arg_channel != preview) { return 404; }
  limit_except GET HEAD { deny all; }
  alias /opt/hqip-flutter-preview/current/releases.json;
  default_type application/json;
  add_header Cache-Control "no-store" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 }
 location = /api/v1/user/installers {
  if ($arg_client = flutter) { rewrite ^ /__hqip_flutter_preview/installers.json last; }
  proxy_pass http://127.0.0.1:18091;
 }
 location = /__hqip_flutter_preview/installers.json {
  internal;
  if ($arg_channel != preview) { return 404; }
  limit_except GET HEAD { deny all; }
  alias /opt/hqip-flutter-preview/current/installers.json;
  default_type application/json;
  add_header Cache-Control "no-store" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 }
 location ~ "^/downloads/flutter/preview/([a-f0-9]{64})/(HQIP-Preview-(Windows-x64(-Setup\.exe|\.zip)|Android-(arm64|x64)\.apk))$" {
  limit_except GET HEAD { deny all; }
  alias /opt/hqip-flutter-preview/objects/$1/$2;
  disable_symlinks on;
  default_type application/octet-stream;
  etag off;
  add_header ETag '"$1"';
  add_header Content-Disposition "attachment";
  add_header Cache-Control "public, max-age=31536000, immutable";
 add_header X-Content-Type-Options nosniff always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 }
 location ~ ^/downloads/flutter/preview/ { return 404; }
 location /__hqip_flutter_preview/ { return 404; }
 # END HQIP Flutter preview
 set_real_ip_from 173.245.48.0/20;
 set_real_ip_from 103.21.244.0/22;
 set_real_ip_from 103.22.200.0/22;
 set_real_ip_from 103.31.4.0/22;
 set_real_ip_from 141.101.64.0/18;
 set_real_ip_from 108.162.192.0/18;
 set_real_ip_from 190.93.240.0/20;
 set_real_ip_from 188.114.96.0/20;
 set_real_ip_from 197.234.240.0/22;
 set_real_ip_from 198.41.128.0/17;
 set_real_ip_from 162.158.0.0/15;
 set_real_ip_from 104.16.0.0/13;
 set_real_ip_from 104.24.0.0/14;
 set_real_ip_from 172.64.0.0/13;
 set_real_ip_from 131.0.72.0/22;
 set_real_ip_from 2400:cb00::/32;
 set_real_ip_from 2606:4700::/32;
 set_real_ip_from 2803:f800::/32;
 set_real_ip_from 2405:b500::/32;
 set_real_ip_from 2405:8100::/32;
 set_real_ip_from 2a06:98c0::/29;
 set_real_ip_from 2c0f:f248::/32;
 real_ip_header CF-Connecting-IP;
 real_ip_recursive off;
 limit_conn hqip_api_connections 200;
 limit_conn_status 429;
 client_header_timeout 15s;
 client_body_timeout 15s;
 send_timeout 30s;
 reset_timedout_connection on;
 client_max_body_size 10m;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header X-Forwarded-Proto https;
 proxy_set_header Connection "";
 proxy_buffering off; proxy_cache off;
 proxy_read_timeout 3600s;
 location = /api/v1/payments/fm/notify { client_max_body_size 16k; proxy_pass http://127.0.0.1:18091; }
 location ~ ^/(api/v1/(client|agents|user)(/|$)|api/v[23]/client(/|$)|sub/|usub/|healthz$|readyz$|downloads/) { proxy_pass http://127.0.0.1:18091; }
 location /api/ { proxy_pass http://127.0.0.1:18090; }
 location = /api { return 404; }
 location = /sub { return 404; }
 location = /usub { return 404; }
 location = /downloads { return 404; }
 location = /s { return 404; }
 location /s/ { return 404; }
 location ~ /\. { return 404; }
 location ^~ /assets/ { try_files $uri =404; }
 location = /favicon.svg { try_files $uri =404; }
 location = /index.html { try_files $uri =404; }
 location / { try_files $uri /index.html; }
}
