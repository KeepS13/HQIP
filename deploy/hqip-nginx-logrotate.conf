# The private subdirectory avoids the distribution's /var/log/nginx/*.log rule.
/var/log/nginx/hqip-control/access.log {
    daily
    maxsize 10M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    su root adm
    sharedscripts
    postrotate
        if /usr/bin/systemctl -q is-active nginx.service; then
            /usr/bin/systemctl kill --kill-who=main --signal=USR1 nginx.service
        fi
    endscript
}
