# Legacy user-portal entry point. Install separately from nginx-hqip.conf.
# Enable only after a certificate covering both names has been issued.
# Canonical origin preserves the portal's existing cookies, CORS and Turnstile.
server {
    listen 80;
    listen [::]:80;
    server_name 5202345.xyz www.5202345.xyz;

    access_log off;
    error_log /dev/null crit;

    location ~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]{1,128}$" {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 302 https://hqip.sharevps.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 5202345.xyz www.5202345.xyz;

    ssl_certificate /etc/letsencrypt/live/5202345.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5202345.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    return 302 https://hqip.sharevps.online$request_uri;
}
