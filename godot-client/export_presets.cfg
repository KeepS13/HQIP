[preset.0]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/fonts/LICENSE.txt,assets/icons/LICENSE.txt"
exclude_filter="tests/*"
export_path="../dist/godot-windows/versions/bundled/HQIP-UI.exe"

[preset.0.options]
custom_template/release="../.local/godot-tools/windows_release_x86_64.exe"
custom_template/debug="../.local/godot-tools/windows_debug_x86_64.exe"
binary_format/embed_pck=false
binary_format/architecture="x86_64"
application/modify_resources=false
codesign/enable=false

[preset.1]
name="Android resources"
platform="Android"
runnable=false
export_filter="all_resources"
include_filter="assets/fonts/LICENSE.txt,assets/icons/LICENSE.txt"
exclude_filter="tests/*"
export_path="../.local/godot-android-assets.zip"

[preset.1.options]
custom_template/release="../.local/godot-tools/android_release.apk"
custom_template/debug="../.local/godot-tools/android_debug.apk"
package/unique_name="online.sharevps.hqip"
package/name="HQIP"
; This preset exports resources only. Gradle receives the APK identity from build_godot.py.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
permissions/internet=true
